############################
# MONITOR
############################
monitor = eDP-1,1920x1080@60,0x0,1


############################
# ENV
############################
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1


############################
# INPUT (LAPTOP)
############################
input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        scroll_factor = 0.6
        disable_while_typing = true
    }
}


############################
# GENERAL
############################
general {
    gaps_in = 5
    gaps_out = 8
    border_size = 0
    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}


############################
# ANIMATIONS (SMOOTH + FAST)
############################
animations {
    enabled = yes

    bezier = smooth, 0.25, 0.9, 0.1, 1.0
    bezier = snappy, 0.3, 0.0, 0.2, 1.0

    animation = windows, 1, 4, smooth
    animation = border, 1, 4, smooth
    animation = fade, 1, 2, snappy
    animation = workspaces, 1, 5, smooth
}


############################
# DWINDLE
############################
dwindle {
    pseudotile = yes
    preserve_split = yes
}


############################
# AUTOSTART
############################
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = swaybg -i /home/nandhu/Downloads/evening-sky.png -m fill


############################
# VARIABLES
############################
$mainMod = SUPER
$terminal = kitty
$browser = firefox


############################
# CORE BINDS
############################
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, Return, togglefloating

bind = $mainMod, T, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, Escape, exec, wlogout


############################
# WORKSPACES
############################
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9


############################
# KEYBOARD WORKSPACE CYCLE
############################
bind = $mainMod, Tab, workspace, e+1
bind = $mainMod SHIFT, Tab, workspace, e-1


############################
# WINDOW FOCUS
############################
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d


############################
# WINDOW MOVE
############################
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

############################
# SCREENSHOTS
############################

# Full screen → clipboard
bind = , Print, exec, grim - | wl-copy

# Select area → clipboard
bind = $mainMod, Print, exec, slurp | grim -g - - | wl-copy

# Full screen → file
bind = SHIFT, Print, exec, grim ~/Pictures/screenshot_$(date +'%Y-%m-%d_%H-%M-%S').png

# Select area → file
bind = $mainMod SHIFT, Print, exec, slurp | grim -g - ~/Pictures/screenshot_$(date +'%Y-%m-%d_%H-%M-%S').png

############################
# MEDIA KEYS
############################
bind = ,XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = ,XF86MonBrightnessDown, exec, brightnessctl set 10%-

bind = ,XF86AudioRaiseVolume, exec, pamixer -i 5
bind = ,XF86AudioLowerVolume, exec, pamixer -d 5
bind = ,XF86AudioMute, exec, pamixer -t
bind = ,XF86AudioMicMute, exec, pamixer --default-source -t


############################
# SCRATCHPAD (FIXED)
############################
############################
# SCRATCHPAD (KITTY - FIXED)
############################

# Toggle scratchpad
bind = $mainMod, grave, togglespecialworkspace, scratchpad

# Spawn scratchpad if not running
bind = $mainMod SHIFT, grave, exec, kitty --single-instance --instance-group scratchpad --title scratchpad

# Rules
windowrulev2 = workspace special:scratchpad silent,title:^(scratchpad)$
windowrulev2 = float,title:^(scratchpad)$
windowrulev2 = center,title:^(scratchpad)$
windowrulev2 = size 80% 60%,title:^(scratchpad)$

############################
# DECORATION
############################
decoration {
    rounding = 10
    blur {
        enabled = false
    }
}


############################
# MISC
############################
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

cursor {
    inactive_timeout = 4
}
